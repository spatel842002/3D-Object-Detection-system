apiVersion: v1
kind: ConfigMap
metadata:
  name: threed-od-config
data:
  YOLO_DEVICE: "cpu"
  DEPTH_DEVICE: "cpu"
  STORAGE_BACKEND: "s3"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_BUCKET_NAME: "threed-od-artifacts"
  S3_REGION: "us-east-1"
  S3_USE_SSL: "false"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  API_CORS_ORIGINS: "http://localhost:5173"
  # S3_ACCESS_KEY / S3_SECRET_KEY are intentionally NOT here -- supply them
  # via a Kubernetes Secret (see k8s/secret.example.yaml) instead of a
  # ConfigMap, since ConfigMaps are not encrypted at rest by default.
