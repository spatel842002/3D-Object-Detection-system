name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1 torchvision==0.24.1
          pip install -e ".[dev]"

      - name: Format check (ruff format)
        run: ruff format --check src tests scripts

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Type check (mypy)
        run: mypy src

      - name: Unit + contract tests with coverage
        run: pytest -m "not model_download" --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1 torchvision==0.24.1
          pip install -e "." pip-audit==2.7.3

      # continue-on-error is scoped to this one step, not the job: the step's
      # pass/fail is still fully visible in the log below. It is set because
      # every advisory currently found requires a major-version migration
      # (mlflow 3.x, pytest 9.x) or is a non-runtime build tool (setuptools);
      # see docs/security.md's "Dependency audit status" section for the
      # per-package reasoning and the follow-up tracked in
      # SHRIYA_PORTFOLIO_BUILD_STATUS.md. Remove this once mlflow/pytest are
      # migrated.
      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable
        continue-on-error: true

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t threed-od-api:ci .

      - name: Smoke-test container health endpoint
        run: |
          docker run -d --name threed-od-ci -p 8000:8000 threed-od-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "Service did not become healthy in time" >&2
          docker logs threed-od-ci
          exit 1
